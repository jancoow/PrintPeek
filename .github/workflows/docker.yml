# Builds the Docker image and publishes it to ghcr.io/jancoow/printpeek:
#   latest      every push to main
#   1.2.3, 1.2  a version tag like v1.2.3
#   sha-abc1234 every build, to pin an exact version
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "docs/**", "LICENSE"]  # nothing in the image changes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # amd64 for PCs and servers, arm64 for a Raspberry Pi 4/5 and other ARM boards
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/printpeek
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
