# PrintPeek registers each printer's camera here automatically (by printer id), plus
# an H.264 version of it (<id>_h264) that uses a fraction of the bandwidth of MJPEG.
# You can also add streams by hand, e.g.:
# streams:
#   voron: http://192.168.1.50/webcam/?action=stream
api:
  listen: ":1984"
rtsp:
  listen: ":8554"   # also used internally by the H.264 transcoding, keep it on

ffmpeg:
  # The H.264 live view (h264_options in the app's config). Full camera resolution, quality-based
  # (CRF) with a 4 Mbit/s ceiling: about 3 Mbit/s for a 1080p printer camera, where its MJPEG
  # stream takes about 12. "veryfast" keeps fine detail like the bed texture; no B-frames and no
  # lookahead keep the delay at a few tenths of a second. (zerolatency would do that too, but at
  # 1080p it needs several CPU cores.) For a GPU, use the app's h264_options: "#video=h264#hardware".
  h264live: "-c:v libx264 -g 20 -profile:v high -level:v 4.1 -preset:v veryfast -bf 0 -rc-lookahead 0 -pix_fmt:v yuv420p -crf 26 -maxrate 4000k -bufsize 8000k"
  # For a slow upload: 720p at most 1.5 Mbit/s, visibly softer.
  # Use with h264_options: "#video=h264lite#width=1280"
  h264lite: "-c:v libx264 -g 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p -maxrate 1500k -bufsize 3000k"
