# PrintPeek: Peek at your prints, from anywhere.
name: printpeek

services:
  app:
    image: ghcr.io/jancoow/printpeek:latest
    # To build it yourself instead: replace the line above with "build: ."
    container_name: printpeek
    restart: unless-stopped
    depends_on: [go2rtc]
    ports:
      - "9022:8080"   # web app (put your reverse proxy in front of this one)
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - ./config:/config:ro
      - ./data:/data

  # Pulls each printer camera once and fans it out to every viewer.
  # Its API (1984) is only reachable by the app inside this stack: it can reconfigure streams,
  # so it's deliberately not published.
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: printpeek-go2rtc
    restart: unless-stopped
    ports:
      - "9023:8554"   # RTSP for LAN players: rtsp://<server>:9023/<printer id>
    volumes:
      - ./go2rtc:/config
