<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; text-align: center; }
    img { width: 72px; height: 72px; }

<body>
  <div>
    <img src="/static/icons/icon.svg" alt="">

  </div>
</body>
</html>
